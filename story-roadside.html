<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadside America — Suki L</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="site-shell">

<header class="site-header">
  <a class="brand" href="index.html">Suki L</a>
  <nav class="nav">
    <a href="work.html" aria-current="page">Work</a>
    <a href="journal.html" >Journal</a>
    <a href="about.html" >About</a>
  </nav>
</header>

<main>
  <section class="story-head">
    <div>
      <p class="page-kicker">United States — 2026</p>
      <h1>Roadside America</h1>
    </div>
    <p class="story-deck">An ongoing collection of landscapes and structures encountered between destinations.</p>
  </section>

  <section class="photo-essay">
    <figure><img class="essay-img" src="images/photo-05.jpg" alt=""><figcaption>01 · United States — 2026</figcaption></figure><figure><img class="essay-img" src="images/photo-07.jpg" alt=""><figcaption>02 · United States — 2026</figcaption></figure><div class="pullquote">The road is often less about arrival than the things noticed in between.</div><figure><img class="essay-img" src="images/photo-01.jpg" alt=""><figcaption>03 · United States — 2026</figcaption></figure><figure><img class="essay-img" src="images/photo-03.jpg" alt=""><figcaption>04 · United States — 2026</figcaption></figure><figure><img class="essay-img" src="images/photo-08.jpg" alt=""><figcaption>05 · United States — 2026</figcaption></figure>
  </section>
</main>

<footer class="footer">
  <span>© 2026 Suki L</span>
  <span>Photography</span>
</footer>

</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">×</button>
  <button class="lb-prev" id="lb-prev">←</button>
  <img id="lb-image" alt="">
  <button class="lb-next" id="lb-next">→</button>
  <div class="lb-meta" id="lb-meta"></div>
</div>

<script>
const imgs=[...document.querySelectorAll('.essay-img')];
const lb=document.getElementById('lightbox');
const li=document.getElementById('lb-image');
const meta=document.getElementById('lb-meta');
let idx=0;
imgs.forEach((im,i)=>{im.style.cursor='zoom-in';im.onclick=()=>openAt(i);});
function openAt(i){
  idx=i;
  li.src=imgs[i].src;
  meta.textContent=`${String(i+1).padStart(2,'0')} / ${String(imgs.length).padStart(2,'0')} · United States — 2026`;
  lb.classList.add('open');
  document.body.classList.add('no-scroll');
}
function closeLb(){
  lb.classList.remove('open');
  document.body.classList.remove('no-scroll');
}
document.getElementById('lb-close').onclick=closeLb;
document.getElementById('lb-prev').onclick=()=>openAt((idx-1+imgs.length)%imgs.length);
document.getElementById('lb-next').onclick=()=>openAt((idx+1)%imgs.length);
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')document.getElementById('lb-prev').click();
  if(e.key==='ArrowRight')document.getElementById('lb-next').click();
});
</script>
</body>
</html>
