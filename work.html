<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">×</button>
  <button class="lb-prev" id="lb-prev">←</button>
  <img id="lb-image" alt="">
  <button class="lb-next" id="lb-next">→</button>
</div>

<script>
const buttons=[...document.querySelectorAll('.open-photo')];
const lb=document.getElementById('lightbox');
const img=document.getElementById('lb-image');
let current=0;
function openAt(i){
  current=i;
  img.src=buttons[i].dataset.src;
  lb.classList.add('open');
  document.body.classList.add('no-scroll');
}
function closeLb(){
  lb.classList.remove('open');
  document.body.classList.remove('no-scroll');
}
buttons.forEach((b,i)=>b.addEventListener('click',()=>openAt(i)));
document.getElementById('lb-close').onclick=closeLb;
document.getElementById('lb-prev').onclick=()=>openAt((current-1+buttons.length)%buttons.length);
document.getElementById('lb-next').onclick=()=>openAt((current+1)%buttons.length);
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') document.getElementById('lb-prev').click();
  if(e.key==='ArrowRight') document.getElementById('lb-next').click();
});
</script>
